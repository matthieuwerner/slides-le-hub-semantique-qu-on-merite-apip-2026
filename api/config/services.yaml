# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

parameters:

services:
    AutoMapper\AutoMapper:
        factory: ['AutoMapper\AutoMapper', 'create']
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            # Generated by Jane from contract/risk-engine.openapi.yaml. Models, normalizers and
            # endpoint classes are data and helpers, not services; autowiring them would register
            # a few dozen services nothing ever asks for.
            - '../src/Infrastructure/Generated/'
            # Plain value objects and enums. Registering them as services would be meaningless.
            - '../src/Domain/'
            - '../src/ApiResource/'

    # ------------------------------------------------------------------------------------------
    # Engine selection
    # ------------------------------------------------------------------------------------------

    App\Engine\EngineRegistry:
        arguments:
            # Resolved through the enum's own from(), so an invalid RISK_ENGINE value fails at
            # container build time with a clear message instead of at the first request.
            $defaultEngine: !service
                class: App\Engine\EngineName
                factory: [App\Engine\EngineName, 'from']
                arguments: ['%env(string:RISK_ENGINE)%']
            $goHttp: '@risk.http.go'
            $phpHttp: '@risk.http.php'
            $allowRequestOverride: '%env(bool:BOUNDARY_LAB_ALLOW_ENGINE_OVERRIDE)%'

    # ------------------------------------------------------------------------------------------
    # Experiment 1 — in-process PHP
    # ------------------------------------------------------------------------------------------

    App\Engine\Php\EnsembleScorer:
        arguments:
            $treeCount: '%env(int:BOUNDARY_LAB_TREE_COUNT)%'

    # ------------------------------------------------------------------------------------------
    # Experiment 2 — Go over HTTP
    # ------------------------------------------------------------------------------------------

    App\Engine\Http\RiskEngineClientFactory:
        arguments:
            $baseUri: '%env(string:RISK_ENGINE_URL)%'
            $timeoutSeconds: '%env(float:RISK_ENGINE_TIMEOUT)%'
            $maxDurationSeconds: '%env(float:RISK_ENGINE_MAX_DURATION)%'

    App\Engine\Http\HttpRiskEngine:
        abstract: true
        arguments:
            $allowWireOverride: '%env(bool:BOUNDARY_LAB_ALLOW_ENGINE_OVERRIDE)%'

    risk.http.go:
        parent: App\Engine\Http\HttpRiskEngine
        autowire: true
        arguments:
            $engineName: 'go-http'

    risk.http.php:
        parent: App\Engine\Http\HttpRiskEngine
        autowire: true
        arguments:
            $engineName: 'php-http'
            $clientFactory: '@risk.client.php'

    risk.client.php:
        class: App\Engine\Http\RiskEngineClientFactory
        arguments:
            $baseUri: '%env(string:PHP_RISK_ENGINE_URL)%'
            $timeoutSeconds: '%env(float:RISK_ENGINE_TIMEOUT)%'
            $maxDurationSeconds: '%env(float:RISK_ENGINE_MAX_DURATION)%'

    App\Domain\Bank\AccountRepository: '@App\Infrastructure\Bank\MongoAccountRepository'
    App\Infrastructure\Bank\MongoAccountRepository:
        arguments:
            $uri: '%env(string:MONGODB_URI)%'

    App\Lab\ScenarioController:
        arguments:
            $enabled: '%env(bool:BOUNDARY_LAB_ALLOW_ENGINE_OVERRIDE)%'

    App\Lab\PrivateRiskController:
        arguments:
            $enabled: '%env(bool:PRIVATE_RISK_SERVICE)%'

    # ------------------------------------------------------------------------------------------
    # Harness entry points
    # ------------------------------------------------------------------------------------------

    # Public because worker.php fetches it from the container directly, before any request is
    # served, to build the scoring model at boot rather than inside somebody's authorization.
    App\Application\EngineWarmer:
        public: true

    App\Lab\Command\GenerateFixturesCommand:
        arguments:
            $treeCount: '%env(int:BOUNDARY_LAB_TREE_COUNT)%'
            $fixturePath: '%kernel.project_dir%/../fixtures/risk-cases.json'

    App\Lab\Command\ParityCommand:
        arguments:
            $treeCount: '%env(int:BOUNDARY_LAB_TREE_COUNT)%'

    App\Lab\Command\MicroBenchCommand:
        arguments:
            $treeCount: '%env(int:BOUNDARY_LAB_TREE_COUNT)%'
