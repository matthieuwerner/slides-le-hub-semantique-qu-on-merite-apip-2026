; Boundary Lab PHP configuration.
;
; The JIT settings here are not incidental tuning — they change the conclusion of the benchmark.
; Measured on this project's ENSEMBLE profile (256 trees, Apple M3):
;
;     opcache off, no JIT   38.3 us/op
;     opcache + tracing JIT  5.2 us/op
;
; That is a 7.3x difference in PHP alone, and it takes the gap against native Go from 18.6x down
; to 2.5x. Benchmarking PHP against another language without the JIT enabled produces a number
; that is real but answers a question nobody asked.

[opcache]
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000

; Safe here because the code never changes inside a running container, and it removes a stat()
; per included file per request.
opcache.validate_timestamps = 0

opcache.jit = tracing
opcache.jit_buffer_size = 128M

[php]
memory_limit = 512M

; The ensemble engine touches tens of thousands of array slots; a larger realpath cache mostly
; helps Symfony's autoloading, which happens once per worker rather than per request.
realpath_cache_size = 4096K
realpath_cache_ttl = 600

expose_php = Off

; Errors go to the container log as structured output rather than into a response body.
display_errors = Off
log_errors = On
error_log = /dev/stderr
